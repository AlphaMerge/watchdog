# Development environment only.
#
# CLAUDE.md hard constraint 2: Docker is for development. Production runs `ms-core` and
# `ms-probe` as native services under systemd (Linux) or WinSW (Windows), and nothing in
# `packages/` may require a container runtime. These services exist so a developer gets
# PostgreSQL/TimescaleDB, a mail sink, protocol simulators and a pinned Node toolchain
# without installing any of them on the host.

name: monitoring-system-dev

services:
  # ---------------------------------------------------------------------------------------
  # Toolchain — the Node runtime for build, test and lint. Not started by `up`; used through
  # `scripts/dev.sh` (or `docker compose run --rm toolchain ...`).
  # ---------------------------------------------------------------------------------------
  toolchain:
    build:
      context: ./dev/toolchain
    working_dir: /workspace
    profiles: ['tools']
    init: true
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: 'false'
      NPM_CONFIG_FUND: 'false'
      CI: 'true'
      # Integration tests reach PostgreSQL by service name on the compose network. They skip
      # themselves when nothing is listening, so `npm test` still works with the stack down —
      # unless the run found it before its first file started, when a file that cannot reach it
      # fails instead (`P-397`).
      MS_TEST_DB_HOST: postgres
      # The database sensors (T-18). Behind the `db` compose profile, so these resolve to nothing
      # unless somebody brought them up; the tests skip themselves in that case.
      MS_TEST_MYSQL_HOST: mariadb
      MS_TEST_MSSQL_HOST: mssql
    volumes:
      - .:/workspace
      - npm-cache:/root/.npm
    entrypoint: ['/bin/bash', '-lc']
    command: ['node --version']

  # ---------------------------------------------------------------------------------------
  # PostgreSQL + TimescaleDB — the only always-on service dependency (CLAUDE.md constraint 3).
  # Stay inside the Apache-2.0 feature set: hypertables, continuous aggregates, native
  # compression, retention policies (CLAUDE.md constraint 4).
  # ---------------------------------------------------------------------------------------
  postgres:
    # **Pinned, because `latest-pg17` is a moving tag and it moved.** CI on a local runner pulled
    # 2.30.0 the day it was released while the developer's container was still 2.29.2 from the
    # same line of this file — and a query-plan test passed for one and failed for the other
    # (`P-198`). Bump it deliberately, so an upgrade is a commit somebody reviewed rather than
    # whichever image a machine happened to pull.
    image: timescale/timescaledb:2.30.0-pg17
    # Docker gives a container 64 MB of /dev/shm, and PostgreSQL puts parallel workers' shared
    # memory there. A `drop_chunks` over a hypertable with a day of readings in it exhausts that
    # and fails with "No space left on device" — which reads like a disk problem and is not one.
    # The perf suite is what hits it; production is a native install with the host's own /dev/shm.
    shm_size: 1gb
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - max_connections=200
      # Timescale Community, matching production (CLAUDE.md constraint 4, ADR-001 Decision 4
      # amendment). We accept that licence for native compression only — 12.5x on disk with no
      # Apache substitute — and write rollups, retention and their scheduler ourselves.
      #
      # Set TIMESCALEDB_LICENSE=apache to check that nothing has quietly grown a dependency on
      # another Timescale-License feature: continuous aggregates, add_job, add_retention_policy
      # and time_bucket_gapfill all fail loudly under it.
      - -c
      - timescaledb.license=${TIMESCALEDB_LICENSE:-timescale}
    environment:
      POSTGRES_DB: monitoring
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: monitoring
      TIMESCALEDB_TELEMETRY: 'off'
    # **The port is a variable so a second stack can exist beside a developer's.** CI runs on a
    # self-hosted runner sharing this machine's Docker, and a fixed 5432 means its database
    # cannot start while the dev stack holds the port — which is how the first local-runner run
    # failed (`P-198`).
    ports:
      - '127.0.0.1:${MS_DEV_PG_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U monitoring -d monitoring']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ---------------------------------------------------------------------------------------
  # MailHog — SMTP sink for the notification workstream (Phase 4, N-07/N-15).
  # SMTP on 1025, web UI on http://localhost:8025
  # ---------------------------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    # Jim, MailHog's chaos monkey, is live in this image and randomly rejects recipients, refuses
    # connections and throttles links. That is a genuinely useful thing to test against — and it
    # is *not* something a test suite can assert against, because a `550 Invalid recipient` is a
    # permanent rejection by every correct reading, so the transport does not retry it and the
    # test simply fails. It cost four tickets' worth of "MailHog is flaky under load" before
    # anybody read its log. Turned off here; raise the numbers deliberately when chaos is the
    # thing being tested.
    environment:
      MH_JIM_ACCEPT: '1.0'
      MH_JIM_DISCONNECT: '0.0'
      MH_JIM_LINKSPEED_AFFECT: '0.0'
      MH_JIM_REJECT_SENDER: '0.0'
      MH_JIM_REJECT_RECIPIENT: '0.0'
      MH_JIM_REJECT_AUTH: '0.0'
    healthcheck:
      test: ['CMD', '/bin/sh', '-c', 'nc -z 127.0.0.1 1025']
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------------------
  # MariaDB and SQL Server — targets for the database sensors (Phase 6, T-18).
  #
  # PostgreSQL is already here and is the third engine, so it needs no second instance: the
  # sensor tests point at the same server the core uses, in a database of their own.
  #
  # Both are behind the `db` profile rather than starting with `npm run dev`. SQL Server alone is
  # 1.5 GB and wants 2 GB of memory, which is a great deal to ask of everybody working on the
  # scheduler — `docker compose -f docker-compose.dev.yml --profile db up -d` brings them up for
  # whoever is working on T-18, and the tests skip themselves when they are not there.
  # ---------------------------------------------------------------------------------------
  mariadb:
    image: mariadb:11.4
    profiles: ['db']
    environment:
      MARIADB_ROOT_PASSWORD: monitoring
      MARIADB_DATABASE: monitoring
      MARIADB_USER: monitoring
      MARIADB_PASSWORD: monitoring
    ports:
      - '127.0.0.1:3306:3306'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Azure SQL Edge rather than `mcr.microsoft.com/mssql/server`, and the reason is the machine
  # this is developed on: SQL Server's own image is amd64 only, and under emulation on Apple
  # silicon it starts, reports healthy, and then segfaults — measured here, `qemu: uncaught
  # target signal 11`. Edge is built for arm64 as well, speaks the same TDS and the same T-SQL,
  # and is therefore a real target for the `tedious` driver on every machine rather than on some
  # of them. It is Microsoft-retired, which matters not at all for something whose whole job is
  # to answer `select 1` in a development stack; swap the image for the full server on an amd64
  # host if you want to check something Edge does not implement.
  mssql:
    image: mcr.microsoft.com/azure-sql-edge:latest
    profiles: ['db']
    environment:
      ACCEPT_EULA: '1'
      MSSQL_SA_PASSWORD: 'Monitoring-dev-1'
    ports:
      - '127.0.0.1:1433:1433'
    healthcheck:
      # Edge ships no `sqlcmd`, so this is the plainest thing that proves the listener is up.
      test: ['CMD', '/bin/sh', '-c', '</dev/tcp/127.0.0.1/1433']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------
  # GreenMail — a mail *server* for the mail sensors (Phase 6, T-17).
  #
  # Not a replacement for MailHog and not a duplicate of it. MailHog is a sink: it swallows SMTP
  # so the notification workstream has somewhere to send to, and it speaks no POP3 or IMAP at
  # all. The mail sensors need the other half — a mailbox that can be opened, counted and read
  # back — and a round-trip sensor needs both halves to be the same server, so that a message
  # posted over SMTP can be found over IMAP.
  #
  # One account, `ops`, so the credential in a dev sensor is the obvious one. Everything is in
  # memory and disappears with the container, which is what you want from a mailbox that a
  # sensor is deleting from every minute.
  #
  #   SMTP 3025 · POP3 3110 · IMAP 3143 · SMTPS 3465 · IMAPS 3993 · POP3S 3995 · API 8080
  # ---------------------------------------------------------------------------------------
  greenmail:
    image: greenmail/standalone:2.1.0
    environment:
      # `setup.test.all` starts every protocol, plain and TLS. `auth.disabled` is *not* set: the
      # mail sensors authenticate, and a server that accepted anything would let a broken
      # credential path pass unnoticed.
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.users=ops:hunter2@ms-mail
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.verbose
    ports:
      - '127.0.0.1:3025:3025'
      - '127.0.0.1:3110:3110'
      - '127.0.0.1:3143:3143'
      - '127.0.0.1:3465:3465'
      - '127.0.0.1:3993:3993'
      - '127.0.0.1:3995:3995'
    healthcheck:
      test: ['CMD', '/bin/sh', '-c', 'nc -z 127.0.0.1 3143']
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------
  # SNMP simulator — a target for the SNMP workstream (Phase 6, T-01…T-06). Replaced by our
  # own harness in P-06; this is enough to develop against in the meantime.
  # ---------------------------------------------------------------------------------------
  snmpsim:
    image: tandrup/snmpsim:latest
    ports:
      - '127.0.0.1:1161:161/udp'
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------
  # Syslog sender — emits a message every few seconds at the probe's syslog listener
  # (Phase 6, T-20). Points at the host by default; override SYSLOG_TARGET to aim elsewhere.
  # ---------------------------------------------------------------------------------------
  syslog-sender:
    image: alpine:3.20
    environment:
      SYSLOG_TARGET: ${SYSLOG_TARGET:-host.docker.internal}
      SYSLOG_PORT: ${SYSLOG_PORT:-1514}
      SYSLOG_INTERVAL: ${SYSLOG_INTERVAL:-5}
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        i=0
        while true; do
          i=$$((i + 1))
          pri=$$((16 * 8 + i % 8))
          printf '<%s>1 %s dev-host ms-devsim %s - - synthetic syslog message %s\n' \
            "$$pri" "$$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" "$$$$" "$$i" \
            | nc -u -w1 "$$SYSLOG_TARGET" "$$SYSLOG_PORT" || true
          sleep "$$SYSLOG_INTERVAL"
        done
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------
  # Monitoring target — a Linux box to point sensors at, not a protocol simulator.
  #
  # snmpsim and syslog-sender each speak one protocol into the void. This is a *device*: one
  # host answering ICMP, HTTP, SSH and SNMP at once, which is the shape the device/sensor
  # object model is built around and the thing to develop the sensor catalogue against
  # (P-05, then the Phase 6 transports).
  #
  # Ports are published on loopback purely so a developer can poke at it by hand; the probe
  # reaches it as `target` on the compose network and needs none of them.
  # ---------------------------------------------------------------------------------------
  target:
    build:
      context: ./dev/target
    hostname: ms-target
    environment:
      TARGET_SSH_USER: ${TARGET_SSH_USER:-monitor}
      TARGET_SSH_PASSWORD: ${TARGET_SSH_PASSWORD:-monitor}
    ports:
      - '127.0.0.1:8081:80'
      - '127.0.0.1:2222:22'
      - '127.0.0.1:1162:161/udp'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1/']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------
  # Web UI — the Vite dev server, for development only.
  #
  # In production `ms-core` serves the built assets itself from `api.webRoot`; there is no
  # second web server to install (ADR-001 Decision 8). This exists so a developer gets hot
  # reload without Node on the host, like everything else here.
  #
  # It proxies /api to the core, so the app calls the same relative paths in both environments
  # and never needs to know which one it is running in. MS_CORE_URL points at wherever the core
  # is: `ms-server` is the name scripts/dev-services.sh gives it on this network.
  #
  # Behind the `ui` profile, so `npm run dev` still brings up only the dependency services.
  # ---------------------------------------------------------------------------------------
  web:
    image: node:24-bookworm
    working_dir: /workspace
    profiles: ['ui']
    init: true
    environment:
      MS_CORE_URL: ${MS_CORE_URL:-http://ms-server:8080}
      NPM_CONFIG_UPDATE_NOTIFIER: 'false'
      NPM_CONFIG_FUND: 'false'
    volumes:
      - .:/workspace
      - npm-cache:/root/.npm
    ports:
      - '127.0.0.1:5173:5173'
    command: ['npm', 'run', 'dev', '--workspace', '@ms/web']
    restart: unless-stopped

volumes:
  postgres-data:
  npm-cache:
