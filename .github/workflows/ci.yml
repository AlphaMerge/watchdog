name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  build:
    name: build, lint and tests
    runs-on: ubuntu-latest

    # The database integration tests skip themselves when nothing is listening, which would
    # quietly mean no coverage in CI. Give them a real PostgreSQL.
    services:
      postgres:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_DB: monitoring
          POSTGRES_USER: monitoring
          POSTGRES_PASSWORD: monitoring
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitoring -d monitoring"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: format
        run: npm run format:check

      # `npm run typecheck` is `tsc -b`, which covers the service packages only — the web app
      # is a Vite project outside that graph and would otherwise be typechecked by nothing until
      # the packaging job built it.
      - name: typecheck and build the web UI
        run: npm run build:web

      # `npm test` is the unit suites only. The measured budgets live behind
      # `npm run test:perf` and are deliberately not run here (`P-21`): a two-core hosted runner
      # cannot measure an eight-core budget, so asserting one would either fail honestly for the
      # wrong reason or pass after being loosened until it meant nothing. They are taken by hand
      # on the reference machine and committed to `docs/findings/`. What CI still protects is that
      # they compile — `npm run typecheck` is `tsc -b`, which covers them.
      - name: tests
        run: npm test

      # A skipped integration suite looks identical to a passing one in the summary line.
      - name: assert the database tests actually ran
        run: |
          output="$(npm test --workspace @ms/core 2>&1)"
          echo "$output"
          if echo "$output" | grep -q 'no PostgreSQL reachable'; then
            echo "::error::database integration tests skipped in CI" >&2
            exit 1
          fi

      # install.sh runs as root on an operator's box; a shell bug there is an outage.
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh deploy/*.sh

      # **Production dependencies only, and that is the point** (A-09). A dev-only advisory is
      # worth knowing about and is not shipped to anybody; failing the build on one would train
      # everybody to ignore this step, which is how the production advisory gets ignored too.
      - name: dependency audit
        run: npm audit --omit=dev --audit-level=high

  install-smoke:
    name: install smoke test on a clean box
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: package
        run: scripts/package.sh

      # Unpacks the tarball on a clean Debian box with a real systemd, runs install.sh and
      # asserts both services reach "active" and stop with exit 0 (PLAN.md Phase 0 exit).
      # Hand it the tarball the previous step built. Without an argument the script builds its
      # own, which is the right default locally but a wasted second build here.
      - name: install smoke test
        run: scripts/smoke-install.sh "$(ls -t release/ms-[0-9]*.tar.gz | head -1)"

      # **Ubuntu as well as Debian**, because Phase 10's exit criterion names it: "a clean install
      # on Ubuntu and on Windows Server". They differ in the things an installer trips over — a
      # different PostgreSQL packaging, a different TimescaleDB repository — so proving one and
      # assuming the other would be assuming the half that differs.
      - name: install smoke test on Ubuntu
        env:
          MS_SMOKE_DISTRO: ubuntu
        run: scripts/smoke-install.sh "$(ls -t release/ms-[0-9]*.tar.gz | head -1)"

      # Backs one host up and restores onto a second, clean one (H-04). Two containers, because
      # restoring over the installation the backup came from proves almost nothing — the data is
      # already there, and a restore that quietly did nothing would pass.
      - name: backup and restore smoke test
        run: scripts/smoke-restore.sh "$(ls -t release/ms-[0-9]*.tar.gz | head -1)"

      # Installs the .deb on Debian and the .rpm on Rocky, upgrades each in place and removes it
      # (H-05). The upgrade is the point: rpm installs the new version before removing the old,
      # so a %preun written like a dpkg prerm leaves the host with nothing enabled and no error
      # anywhere. `scripts/package.sh` already ran above, so this packages what it staged.
      - name: package smoke test
        run: scripts/smoke-packages.sh

      # Built here rather than on the Windows runner because wixl is msitools and runs on Linux —
      # the MSI comes off the same staged tree as every other artefact. The Windows job installs
      # what this produces.
      - name: build the Windows installers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wixl msitools
          scripts/package-msi.sh
          scripts/package.sh --probe-only
          scripts/package-msi.sh --probe-only

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-artifacts
          path: |
            release/*.tar.gz
            release/*.deb
            release/*.rpm
            release/*.msi
          retention-days: 7

  # **The Windows half of Phase 10's exit criterion**, on the Windows Server the hosted runner
  # already is. Until this existed, H-06 shipped an MSI that had never been installed and the
  # blocker was recorded as "needs hardware nobody has" — which was wrong: `windows-latest` is
  # Windows Server 2022, and the missing thing was a job, not a machine.
  #
  # It does not cover H-09's field test — a hundred real devices for a week is still hardware and
  # wall-clock this cannot reach. What it does cover is the installer: that the MSI installs, that
  # the services register, that the firewall rules appear, that an upgrade over it keeps the
  # configuration, and that removing it takes the services away and leaves the data.
  windows-install:
    name: MSI installs on Windows Server
    needs: install-smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release

      # The scripts the MSI runs are PowerShell, and a parse error in one of them breaks every
      # Windows install. Nothing else in this repository can check that: PowerShell publishes no
      # arm64 container, and the amd64 one dies under emulation on an Apple Silicon developer
      # machine, so this is the first place the question can even be asked.
      - name: parse-check the installer scripts
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Path deploy -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $bad++
              Write-Host "FAIL $($_.FullName)"
              $errors | ForEach-Object { Write-Host "     line $($_.Extent.StartLineNumber): $($_.Message)" }
            } else { Write-Host "ok   $($_.Name)" }
          }
          if ($bad -gt 0) { exit 1 }

      - name: install the MSI
        shell: pwsh
        run: |
          $msi = (Get-ChildItem release/ms-*-x64.msi | Where-Object { $_.Name -notlike '*probe*' } | Select-Object -First 1).FullName
          Write-Host "installing $msi"
          # /qn so it cannot wait on a dialog, and a verbose log because the first failure on a
          # machine nobody has tested is exactly when the log is the finding.
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait -PassThru
          Write-Host "msiexec exit: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 80; exit 1 }

      - name: assert the install did its work
        shell: pwsh
        run: |
          $prefix = "$env:ProgramFiles\MonitoringSystem"
          foreach ($f in @('ms-setup.ps1', 'ms-teardown.ps1', 'VERSION', 'app.zip')) {
            if (-not (Test-Path (Join-Path $prefix $f))) { throw "missing from the install: $f" }
          }
          # ms-setup expands app.zip, so the application tree is the proof the action ran at all.
          if (-not (Test-Path (Join-Path $prefix 'app'))) { throw 'app.zip was never expanded — the custom action did not run' }
          Write-Host 'files and expansion: ok'

          # Services and firewall are what H-06 asks for beyond laying down files.
          foreach ($svc in @('ms-core', 'ms-probe')) {
            $s = Get-Service -Name $svc -ErrorAction SilentlyContinue
            if (-not $s) { throw "service $svc was not registered" }
            Write-Host "service ${svc}: $($s.Status)"
          }
          foreach ($rule in @('MonitoringSystem API', 'MonitoringSystem probe channel')) {
            if (-not (Get-NetFirewallRule -DisplayName $rule -ErrorAction SilentlyContinue)) {
              throw "firewall rule missing: $rule"
            }
            Write-Host "firewall rule: $rule"
          }

      - name: upgrade over it, and keep the configuration
        shell: pwsh
        run: |
          $data = "$env:ProgramData\MonitoringSystem"
          $cfg = Join-Path $data 'core.json'
          $json = Get-Content $cfg -Raw | ConvertFrom-Json
          $json.database.password = 'set-by-the-operator'
          $json | ConvertTo-Json -Depth 20 | Set-Content $cfg
          $msi = (Get-ChildItem release/ms-*-x64.msi | Where-Object { $_.Name -notlike '*probe*' } | Select-Object -First 1).FullName
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v upgrade.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content upgrade.log -Tail 80; exit 1 }
          if ((Get-Content $cfg -Raw) -notmatch 'set-by-the-operator') {
            throw 'the upgrade overwrote the configuration'
          }
          if (-not (Get-ChildItem $data -Filter 'core.json.*.bak')) {
            throw 'the upgrade took no backup'
          }
          Write-Host 'configuration preserved, backup taken'

      - name: uninstall, and keep the data
        shell: pwsh
        run: |
          $msi = (Get-ChildItem release/ms-*-x64.msi | Where-Object { $_.Name -notlike '*probe*' } | Select-Object -First 1).FullName
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn /l*v uninstall.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content uninstall.log -Tail 80; exit 1 }
          foreach ($svc in @('ms-core', 'ms-probe')) {
            if (Get-Service -Name $svc -ErrorAction SilentlyContinue) { throw "service $svc survived removal" }
          }
          # ProgramData is left on purpose: it holds the vault key, and without it no stored
          # credential can ever be decrypted again.
          if (-not (Test-Path "$env:ProgramData\MonitoringSystem\core.json")) {
            throw 'removal deleted the configuration, which it must not'
          }
          Write-Host 'services gone, data left in place'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-install-logs
          path: |
            install.log
            upgrade.log
            uninstall.log
          retention-days: 7

  enrol-smoke:
    name: remote probe enrolment across two boxes
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Builds both packages itself: this test is about the two of them agreeing, so handing it
      # a tarball built by another step would let them drift apart unnoticed. R-07.
      - name: enrolment smoke test
        run: scripts/smoke-enrol.sh

  dev-environment:
    name: dev compose comes up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: start dependency services
        run: docker compose -f docker-compose.dev.yml up -d --wait postgres mailhog

      - name: TimescaleDB is present and the licence is pinned
        run: |
          docker compose -f docker-compose.dev.yml exec -T postgres \
            psql -U monitoring -d monitoring -tAc \
            "SELECT extname || ' ' || extversion FROM pg_extension WHERE extname='timescaledb'"
          docker compose -f docker-compose.dev.yml exec -T postgres \
            psql -U monitoring -d monitoring -tAc "SHOW timescaledb.license"

      - name: tear down
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v
