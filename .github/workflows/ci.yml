name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run it on demand. `windows-install` is the only place H-06's MSI is ever installed, and
  # wanting that answer is not the same as wanting a twelve-minute run on every push.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  build:
    name: build, lint and tests
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LINUX || '["self-hosted","watchdog-linux"]') }}

    # **The database comes from this repository's own compose file, not from a `services:` block.**
    # Two reasons, both found by the first run on a local runner (`P-198`). A service container is
    # published to the *host*, and this runner is itself a container — so `localhost` inside the
    # job is not where the service is, and the job could not reach it however the ports were
    # arranged. And the block declared a second, subtly different PostgreSQL: no `shm_size`, no
    # pinned `timescaledb.license`, free to drift from the one everybody develops against.
    #
    # `MS_DEV_PG_PORT` keeps it off the developer's 5432 and `-p` keeps its containers and volumes
    # separate, so `down -v` at the end removes what this job made and nothing of theirs.
    env:
      COMPOSE: docker compose -p watchdog-ci -f docker-compose.dev.yml
      MS_DEV_PG_PORT: '55432'
      # Reached across the container boundary: Docker Desktop resolves this name to the host, and
      # `dev-runner.sh` adds it as `host-gateway` so a Linux runner behaves the same. Set
      # `CI_DB_HOST` to `127.0.0.1` if these jobs are ever moved back to a hosted runner.
      MS_TEST_DB_HOST: ${{ vars.CI_DB_HOST || 'host.docker.internal' }}
      MS_TEST_DB_PORT: '55432'
      # A database this job failed to reach fails the suites that need it, rather than skipping
      # them (`P-397`). Locally the run decides for itself, from one probe before any file starts.
      MS_TEST_DB_REQUIRED: '1'

    steps:
      - uses: actions/checkout@v4

      # `--wait` blocks on the healthcheck the compose file already declares, so the first test to
      # open a connection is not the thing waiting for the server to finish starting.
      - name: start the test database
        run: $COMPOSE up -d --wait postgres

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: format
        run: npm run format:check

      # `npm run typecheck` is `tsc -b`, which covers the service packages only — the web app
      # is a Vite project outside that graph and would otherwise be typechecked by nothing until
      # the packaging job built it.
      - name: typecheck and build the web UI
        run: npm run build:web

      # `npm test` is the unit suites only. The measured budgets live behind
      # `npm run test:perf` and are deliberately not run here (`P-21`): a two-core hosted runner
      # cannot measure an eight-core budget, so asserting one would either fail honestly for the
      # wrong reason or pass after being loosened until it meant nothing. They are taken by hand
      # on the reference machine and committed to `docs/findings/`. What CI still protects is that
      # they compile — `npm run typecheck` is `tsc -b`, which covers them.
      - name: tests
        run: npm test

      # A skipped integration suite looks identical to a passing one in the summary line.
      - name: assert the database tests actually ran
        run: |
          output="$(npm test --workspace @ms/core 2>&1)"
          echo "$output"
          if echo "$output" | grep -q 'no PostgreSQL reachable'; then
            echo "::error::database integration tests skipped in CI" >&2
            exit 1
          fi

      # install.sh runs as root on an operator's box; a shell bug there is an outage.
      # **Derived from the tree, not a list of directories somebody remembered** (`P-202`). The
      # enumerated version read `scripts/*.sh scripts/sizing/*.sh deploy/*.sh` and reached 24 of
      # 36 scripts: it missed `scripts/lib`, which every harness *sources*, and `scripts/smoke`,
      # which runs inside the smoke boxes — so a parse error in the files that break everything at
      # once was the one thing nothing checked. A directory added later is the case a hand-written
      # glob cannot cover, and `scripts/lib` was added later.
      - name: shellcheck
        run: git ls-files '*.sh' | xargs shellcheck -S warning

      # The dev container's supervisor, which once kept ms-server Up for ten hours with no core
      # in it: a fake `node`, every way a process can stop, run both as a file and as `bash -c`.
      - name: ms-server supervisor
        run: bash scripts/test-ms-server-supervisor.sh

      # **The workflow is the one file nothing else checks**, and it is now five jobs across two
      # operating systems. A bad expression or an unknown runner costs a whole CI cycle to find
      # out about, and the Windows job in particular is expensive to discover a typo in.
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest \
            -ignore 'SC2012' .github/workflows/*.yml

      # **Production dependencies only, and that is the point** (A-09). A dev-only advisory is
      # worth knowing about and is not shipped to anybody; failing the build on one would train
      # everybody to ignore this step, which is how the production advisory gets ignored too.
      - name: dependency audit
        run: npm audit --omit=dev --audit-level=high

      # `-v` is safe here only because of `-p` above: it removes this job's own volume, not the
      # `postgres-data` a developer has been filling all week.
      - name: stop the test database
        if: always()
        run: $COMPOSE down -v

  install-smoke:
    name: install smoke test on a clean box
    needs: build
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LINUX || '["self-hosted","watchdog-linux"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: package
        run: scripts/package.sh

      # Unpacks the tarball on a clean Debian box with a real systemd, runs install.sh and
      # asserts both services reach "active" and stop with exit 0 (PLAN.md Phase 0 exit).
      # Hand it the tarball the previous step built. Without an argument the script builds its
      # own, which is the right default locally but a wasted second build here.
      - name: install smoke test
        run: scripts/smoke-install.sh "$(ls -t release/ms-[0-9]*.tar.gz | head -1)"

      # **Ubuntu as well as Debian**, because Phase 10's exit criterion names it: "a clean install
      # on Ubuntu and on Windows Server". They differ in the things an installer trips over — a
      # different PostgreSQL packaging, a different TimescaleDB repository — so proving one and
      # assuming the other would be assuming the half that differs.
      - name: install smoke test on Ubuntu
        env:
          MS_SMOKE_DISTRO: ubuntu
        run: scripts/smoke-install.sh "$(ls -t release/ms-[0-9]*.tar.gz | head -1)"

      # Backs one host up and restores onto a second, clean one (H-04). Two containers, because
      # restoring over the installation the backup came from proves almost nothing — the data is
      # already there, and a restore that quietly did nothing would pass.
      - name: backup and restore smoke test
        run: scripts/smoke-restore.sh "$(ls -t release/ms-[0-9]*.tar.gz | head -1)"

      # Installs the .deb on Debian and the .rpm on Rocky, upgrades each in place and removes it
      # (H-05). The upgrade is the point: rpm installs the new version before removing the old,
      # so a %preun written like a dpkg prerm leaves the host with nothing enabled and no error
      # anywhere. `scripts/package.sh` already ran above, so this packages what it staged.
      - name: package smoke test
        run: scripts/smoke-packages.sh

      # Built here rather than on the Windows runner because wixl is msitools and runs on Linux —
      # the MSI comes off the same staged tree as every other artefact. The Windows job installs
      # what this produces. `msitools` is in the runner image (`dev/runner/Dockerfile`), so this
      # no longer installs it per run: a hosted image needed that and a local one already has it.
      - name: build the Windows installers
        run: |
          scripts/package-msi.sh
          scripts/package.sh --probe-only
          scripts/package-msi.sh --probe-only

      # **Uploaded only when something is waiting to download it.** `windows-install` is the sole
      # consumer and it is skipped until `CI_RUNNER_WINDOWS` names a machine, so on this
      # installation the upload was pure cost — and it is a cost that fails: the account's
      # artifact *storage* quota is full, which is a separate billed resource from runner minutes
      # and one local runners do nothing about. It failed an otherwise green run on exactly that
      # (`P-198`), with this repository storing no artifacts at all; the quota is consumed
      # elsewhere in the account.
      #
      # The same variable that brings the Windows job back brings its input back with it, so
      # there is one switch rather than two to remember.
      - uses: actions/upload-artifact@v4
        if: always() && vars.CI_RUNNER_WINDOWS != ''
        with:
          name: release-artifacts
          path: |
            release/*.tar.gz
            release/*.deb
            release/*.rpm
            release/*.msi
          retention-days: 7

  # **The Windows half of Phase 10's exit criterion**, on the Windows Server the hosted runner
  # already is. Until this existed, H-06 shipped an MSI that had never been installed and the
  # blocker was recorded as "needs hardware nobody has" — which was wrong: `windows-latest` is
  # Windows Server 2022, and the missing thing was a job, not a machine.
  #
  # It does not cover H-09's field test — a hundred real devices for a week is still hardware and
  # wall-clock this cannot reach. What it does cover is the installer: that the MSI installs, that
  # the services register, that the firewall rules appear, that an upgrade over it keeps the
  # configuration, and that removing it takes the services away and leaves the data.
  windows-install:
    name: MSI installs on Windows Server
    needs: install-smoke
    # **Skipped, not deleted, until there is a Windows machine to run it on.** This installation
    # uses self-hosted runners only — the hosted ones fail in two seconds with zero steps while
    # the account's Actions spending limit is unpaid, which is a red cross nobody can act on
    # rather than a gap in coverage. There is no Windows box here yet, so the job waits for one:
    # register a runner on it, set `CI_RUNNER_WINDOWS` to its label, and this comes back exactly
    # as written. Nothing else in this file needs to change on that day.
    if: vars.CI_RUNNER_WINDOWS != ''
    runs-on: ${{ vars.CI_RUNNER_WINDOWS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release

      # The scripts the MSI runs are PowerShell, and a parse error in one of them breaks every
      # Windows install. Nothing else in this repository can check that: PowerShell publishes no
      # arm64 container, and the amd64 one dies under emulation on an Apple Silicon developer
      # machine, so this is the first place the question can even be asked.
      - name: parse-check the installer scripts
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Path deploy -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $bad++
              Write-Host "FAIL $($_.FullName)"
              $errors | ForEach-Object { Write-Host "     line $($_.Extent.StartLineNumber): $($_.Message)" }
            } else { Write-Host "ok   $($_.Name)" }
          }
          if ($bad -gt 0) { exit 1 }

      - name: install the MSI
        shell: pwsh
        run: |
          $msi = (Get-ChildItem release/ms-*-x64.msi | Where-Object { $_.Name -notlike '*probe*' } | Select-Object -First 1).FullName
          Write-Host "installing $msi"
          # /qn so it cannot wait on a dialog, and a verbose log because the first failure on a
          # machine nobody has tested is exactly when the log is the finding.
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait -PassThru
          Write-Host "msiexec exit: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 80; exit 1 }

      - name: assert the install did its work
        shell: pwsh
        run: |
          $prefix = "$env:ProgramFiles\MonitoringSystem"
          foreach ($f in @('ms-setup.ps1', 'ms-teardown.ps1', 'VERSION', 'app.zip')) {
            if (-not (Test-Path (Join-Path $prefix $f))) { throw "missing from the install: $f" }
          }
          # ms-setup expands app.zip, so the application tree is the proof the action ran at all.
          if (-not (Test-Path (Join-Path $prefix 'app'))) { throw 'app.zip was never expanded — the custom action did not run' }
          Write-Host 'files and expansion: ok'

          # Services and firewall are what H-06 asks for beyond laying down files.
          foreach ($svc in @('ms-core', 'ms-probe')) {
            $s = Get-Service -Name $svc -ErrorAction SilentlyContinue
            if (-not $s) { throw "service $svc was not registered" }
            Write-Host "service ${svc}: $($s.Status)"
          }
          foreach ($rule in @('MonitoringSystem API', 'MonitoringSystem probe channel')) {
            if (-not (Get-NetFirewallRule -DisplayName $rule -ErrorAction SilentlyContinue)) {
              throw "firewall rule missing: $rule"
            }
            Write-Host "firewall rule: $rule"
          }

      - name: upgrade over it, and keep the configuration
        shell: pwsh
        run: |
          $data = "$env:ProgramData\MonitoringSystem"
          $cfg = Join-Path $data 'core.json'
          $json = Get-Content $cfg -Raw | ConvertFrom-Json
          $json.database.password = 'set-by-the-operator'
          $json | ConvertTo-Json -Depth 20 | Set-Content $cfg
          $msi = (Get-ChildItem release/ms-*-x64.msi | Where-Object { $_.Name -notlike '*probe*' } | Select-Object -First 1).FullName
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v upgrade.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content upgrade.log -Tail 80; exit 1 }
          if ((Get-Content $cfg -Raw) -notmatch 'set-by-the-operator') {
            throw 'the upgrade overwrote the configuration'
          }
          if (-not (Get-ChildItem $data -Filter 'core.json.*.bak')) {
            throw 'the upgrade took no backup'
          }
          Write-Host 'configuration preserved, backup taken'

      - name: uninstall, and keep the data
        shell: pwsh
        run: |
          $msi = (Get-ChildItem release/ms-*-x64.msi | Where-Object { $_.Name -notlike '*probe*' } | Select-Object -First 1).FullName
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn /l*v uninstall.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content uninstall.log -Tail 80; exit 1 }
          foreach ($svc in @('ms-core', 'ms-probe')) {
            if (Get-Service -Name $svc -ErrorAction SilentlyContinue) { throw "service $svc survived removal" }
          }
          # ProgramData is left on purpose: it holds the vault key, and without it no stored
          # credential can ever be decrypted again.
          if (-not (Test-Path "$env:ProgramData\MonitoringSystem\core.json")) {
            throw 'removal deleted the configuration, which it must not'
          }
          Write-Host 'services gone, data left in place'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-install-logs
          path: |
            install.log
            upgrade.log
            uninstall.log
          retention-days: 7

  # **The other half of the Windows story, and the one `S-11` has been open on** — not the
  # installer this time but the database under it. `S-11`'s decision half is answered from the
  # release channel: TimescaleDB publishes current Windows builds and they carry the licensed
  # module, so no plain-PostgreSQL fallback engine is needed on availability grounds
  # (`docs/findings/2026-09-03-timescaledb-on-windows.md`). What could not be answered without
  # Windows is whether any of it *runs*: whether `setup.exe` composes with a PostgreSQL somebody
  # installed themselves, and whether the one Timescale-Licence feature this product depends on —
  # native compression — works there.
  #
  # A hosted runner answers that and does not answer the other thing `S-11` asks for. This is
  # pass/fail, which a shared VM settles as well as bare metal; the benchmark is a measurement,
  # and a number taken beside neighbours nobody can see is not one (`CLAUDE.md`, `P-192`).
  #
  # No `needs:`, because it depends on nothing this workflow builds — only on the repository and
  # a PostgreSQL it installs itself. That also makes it the cheapest job to dispatch alone.
  windows-timescaledb:
    name: TimescaleDB provisions on Windows Server
    # **Skipped, not deleted, until there is a Windows machine to run it on.** This installation
    # uses self-hosted runners only — the hosted ones fail in two seconds with zero steps while
    # the account's Actions spending limit is unpaid, which is a red cross nobody can act on
    # rather than a gap in coverage. There is no Windows box here yet, so the job waits for one:
    # register a runner on it, set `CI_RUNNER_WINDOWS` to its label, and this comes back exactly
    # as written. Nothing else in this file needs to change on that day.
    if: vars.CI_RUNNER_WINDOWS != ''
    runs-on: ${{ vars.CI_RUNNER_WINDOWS }}
    steps:
      - uses: actions/checkout@v4

      # The runner ships PostgreSQL 14, and TimescaleDB publishes no Windows build for it — 15
      # was dropped at 2.29.0 and 14 before that. So install one that is covered rather than
      # discover the gap halfway through an install; `provision-postgres.ps1` refuses with that
      # sentence if this ever stops being true.
      - name: install a PostgreSQL TimescaleDB still builds for
        shell: pwsh
        run: |
          choco install postgresql17 --no-progress --yes `
            --params '/Password:postgres' --ia '--enable-components server,commandlinetools'
          $bin = 'C:\Program Files\PostgreSQL\17\bin'
          if (-not (Test-Path $bin)) { throw "PostgreSQL 17 did not land at $bin" }
          echo $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: provision it
        shell: pwsh
        env:
          PGPASSWORD: postgres
        run: ./scripts/windows/provision-postgres.ps1

      # **The assertions are the three claims `S-11` rests on**, in the order they would fail.
      # `extversion` says the extension loaded at all; the licence says the TSL half is available,
      # which migration 004 refuses to run without; and compressing a chunk is the one accepted
      # Timescale-Licence feature actually doing its job. A green `CREATE EXTENSION` with
      # compression that throws would be the worst outcome to ship, because it looks like a pass.
      - name: assert the extension is loaded, licensed and compressing
        shell: pwsh
        env:
          PGPASSWORD: postgres
        run: |
          function Invoke-Psql {
            param([string] $Sql)
            $out = & psql -U postgres -d monitoring -v ON_ERROR_STOP=1 -tAc $Sql
            if ($LASTEXITCODE -ne 0) { throw "psql failed: $Sql" }
            return ($out | Out-String).Trim()
          }

          $version = Invoke-Psql "SELECT extversion FROM pg_extension WHERE extname='timescaledb'"
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'timescaledb is not installed in the database' }
          Write-Host "timescaledb $version"

          $licence = Invoke-Psql 'SHOW timescaledb.license'
          if ($licence -ne 'timescale') { throw "timescaledb.license is '$licence', so migration 004 would refuse to apply" }

          # One statement per call rather than a here-string: `'@` has to sit at column zero in
          # PowerShell, and column zero is not available inside a YAML block scalar.
          Invoke-Psql 'CREATE TABLE sample (time timestamptz NOT NULL, channel_id int NOT NULL, value double precision)' | Out-Null
          Invoke-Psql "SELECT create_hypertable('sample', 'time')" | Out-Null
          Invoke-Psql "INSERT INTO sample SELECT now() - (n || ' minutes')::interval, 1, n FROM generate_series(1, 5000) n" | Out-Null
          Invoke-Psql "ALTER TABLE sample SET (timescaledb.compress, timescaledb.compress_segmentby = 'channel_id', timescaledb.compress_orderby = 'time')" | Out-Null

          # The whole point: compression is the Timescale-Licence feature `CLAUDE.md` accepts the
          # licence for, and it is worth 12.5x on disk. If it does not run here, a Windows
          # installation is a different product from a Linux one.
          $compressed = Invoke-Psql "SELECT count(*) FROM (SELECT compress_chunk(c) FROM show_chunks('sample') c) s"
          if ([int]$compressed -lt 1) { throw 'no chunk was compressed' }
          Write-Host "compressed $compressed chunks"

  enrol-smoke:
    name: remote probe enrolment across two boxes
    needs: build
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LINUX || '["self-hosted","watchdog-linux"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Builds both packages itself: this test is about the two of them agreeing, so handing it
      # a tarball built by another step would let them drift apart unnoticed. R-07.
      - name: enrolment smoke test
        run: scripts/smoke-enrol.sh

  # **`down -v` is why this job carries its own project name.** On a hosted runner the machine is
  # thrown away and the flag costs nothing. On a self-hosted runner it is the developer's Docker,
  # and the default project name is the one their dev stack is already running under — so the
  # teardown would delete the `postgres_data` volume out from under them, which is hours of local
  # state and no warning. `-p` gives this job its own containers, network and volumes, so `-v`
  # removes exactly what this job created.
  dev-environment:
    name: dev compose comes up
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LINUX || '["self-hosted","watchdog-linux"]') }}
    env:
      COMPOSE: docker compose -p watchdog-ci -f docker-compose.dev.yml
      # Off the developer's 5432, for the same reason the build job is (`P-198`).
      MS_DEV_PG_PORT: '55432'
    steps:
      - uses: actions/checkout@v4

      - name: start dependency services
        run: $COMPOSE up -d --wait postgres mailhog

      - name: TimescaleDB is present and the licence is pinned
        run: |
          $COMPOSE exec -T postgres \
            psql -U monitoring -d monitoring -tAc \
            "SELECT extname || ' ' || extversion FROM pg_extension WHERE extname='timescaledb'"
          $COMPOSE exec -T postgres \
            psql -U monitoring -d monitoring -tAc "SHOW timescaledb.license"

      - name: tear down
        if: always()
        run: $COMPOSE down -v
