name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  build:
    name: build, lint and tests
    runs-on: ubuntu-latest

    # The database integration tests skip themselves when nothing is listening, which would
    # quietly mean no coverage in CI. Give them a real PostgreSQL.
    services:
      postgres:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_DB: monitoring
          POSTGRES_USER: monitoring
          POSTGRES_PASSWORD: monitoring
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitoring -d monitoring"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: format
        run: npm run format:check

      # `npm run typecheck` is `tsc -b`, which covers the service packages only — the web app
      # is a Vite project outside that graph and would otherwise be typechecked by nothing until
      # the packaging job built it.
      - name: typecheck and build the web UI
        run: npm run build:web

      # `npm test` is the unit suites only. The measured budgets live behind
      # `npm run test:perf` and are deliberately not run here (`P-21`): a two-core hosted runner
      # cannot measure an eight-core budget, so asserting one would either fail honestly for the
      # wrong reason or pass after being loosened until it meant nothing. They are taken by hand
      # on the reference machine and committed to `docs/findings/`. What CI still protects is that
      # they compile — `npm run typecheck` is `tsc -b`, which covers them.
      - name: tests
        run: npm test

      # A skipped integration suite looks identical to a passing one in the summary line.
      - name: assert the database tests actually ran
        run: |
          output="$(npm test --workspace @ms/core 2>&1)"
          echo "$output"
          if echo "$output" | grep -q 'no PostgreSQL reachable'; then
            echo "::error::database integration tests skipped in CI" >&2
            exit 1
          fi

      # install.sh runs as root on an operator's box; a shell bug there is an outage.
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh deploy/*.sh

      # **Production dependencies only, and that is the point** (A-09). A dev-only advisory is
      # worth knowing about and is not shipped to anybody; failing the build on one would train
      # everybody to ignore this step, which is how the production advisory gets ignored too.
      - name: dependency audit
        run: npm audit --omit=dev --audit-level=high

  install-smoke:
    name: install smoke test on a clean box
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: package
        run: scripts/package.sh

      # Unpacks the tarball on a clean Debian box with a real systemd, runs install.sh and
      # asserts both services reach "active" and stop with exit 0 (PLAN.md Phase 0 exit).
      # Hand it the tarball the previous step built. Without an argument the script builds its
      # own, which is the right default locally but a wasted second build here.
      - name: install smoke test
        run: scripts/smoke-install.sh "$(ls -t release/ms-[0-9]*.tar.gz | head -1)"

      # Backs one host up and restores onto a second, clean one (H-04). Two containers, because
      # restoring over the installation the backup came from proves almost nothing — the data is
      # already there, and a restore that quietly did nothing would pass.
      - name: backup and restore smoke test
        run: scripts/smoke-restore.sh "$(ls -t release/ms-[0-9]*.tar.gz | head -1)"

      # Installs the .deb on Debian and the .rpm on Rocky, upgrades each in place and removes it
      # (H-05). The upgrade is the point: rpm installs the new version before removing the old,
      # so a %preun written like a dpkg prerm leaves the host with nothing enabled and no error
      # anywhere. `scripts/package.sh` already ran above, so this packages what it staged.
      - name: package smoke test
        run: scripts/smoke-packages.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-artifacts
          path: |
            release/*.tar.gz
            release/*.deb
            release/*.rpm
          retention-days: 7

  enrol-smoke:
    name: remote probe enrolment across two boxes
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Builds both packages itself: this test is about the two of them agreeing, so handing it
      # a tarball built by another step would let them drift apart unnoticed. R-07.
      - name: enrolment smoke test
        run: scripts/smoke-enrol.sh

  dev-environment:
    name: dev compose comes up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: start dependency services
        run: docker compose -f docker-compose.dev.yml up -d --wait postgres mailhog

      - name: TimescaleDB is present and the licence is pinned
        run: |
          docker compose -f docker-compose.dev.yml exec -T postgres \
            psql -U monitoring -d monitoring -tAc \
            "SELECT extname || ' ' || extversion FROM pg_extension WHERE extname='timescaledb'"
          docker compose -f docker-compose.dev.yml exec -T postgres \
            psql -U monitoring -d monitoring -tAc "SHOW timescaledb.license"

      - name: tear down
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v
